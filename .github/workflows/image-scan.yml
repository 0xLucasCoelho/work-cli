name: image-scan

# Scans the container images and the dependency tree for known vulnerabilities.
# Triggers on changes to either Dockerfile plus a weekly refresh.
on:
  push:
    branches: [main]
    paths: ["crates/docker/**", "Dockerfile.personal"]
  pull_request:
    paths: ["crates/docker/**", "Dockerfile.personal"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - crates/docker/work-base.Dockerfile
          - Dockerfile.personal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -f "${{ matrix.dockerfile }}" -t work-scan .
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: work-scan
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
