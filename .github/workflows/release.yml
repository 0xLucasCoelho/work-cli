name: release

# Builds static-ish release binaries for macOS (arm64/x86_64) and Linux on tag.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, archive: work-aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin, archive: work-x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: work-x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/work staging/
          cp README.md LICENSE staging/
          tar -czf ${{ matrix.archive }}.tar.gz -C staging .
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}.tar.gz
