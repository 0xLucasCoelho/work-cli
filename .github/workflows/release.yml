name: release

# Builds static-ish release binaries for macOS (arm64/x86_64) and Linux on tag.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, archive: work-aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin, archive: work-x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: work-x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/work staging/
          cp README.md LICENSE staging/
          tar -czf ${{ matrix.archive }}.tar.gz -C staging .
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ matrix.archive }}.tar.gz
      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ matrix.archive }}.tar.gz

  update-tap:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Fetch assets + sha256
        id: sha
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          curl -fsSL "$BASE/work-aarch64-apple-darwin.tar.gz"     -o a.tar.gz
          curl -fsSL "$BASE/work-x86_64-apple-darwin.tar.gz"      -o i.tar.gz
          curl -fsSL "$BASE/work-x86_64-unknown-linux-gnu.tar.gz" -o l.tar.gz
          echo "arm64=$(sha256sum a.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "intel=$(sha256sum i.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux=$(sha256sum l.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Render Formula
        run: |
          mkdir -p out/Formula
          sed \
            -e "s/@VERSION@/${{ steps.v.outputs.version }}/g" \
            -e "s/@ARM64_SHA@/${{ steps.sha.outputs.arm64 }}/g" \
            -e "s/@INTEL_SHA@/${{ steps.sha.outputs.intel }}/g" \
            -e "s/@LINUX_SHA@/${{ steps.sha.outputs.linux }}/g" \
            distribution/homebrew/work.rb.template > out/Formula/work.rb
          cat out/Formula/work.rb
      - name: Push to homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 0xlucascoelho/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Commit formula
        run: |
          mkdir -p tap/Formula
          cp out/Formula/work.rb tap/Formula/work.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/work.rb
          git commit -m "work ${{ steps.v.outputs.version }}" || echo "no changes"
          git push
