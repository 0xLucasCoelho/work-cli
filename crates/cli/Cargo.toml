[package]
name = "work"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "work"
path = "src/main.rs"

[dependencies]
work-core.workspace = true
anyhow.workspace = true
clap.workspace = true
# Dynamic (live workspace-name) completion. `unstable-dynamic` is UNSTABLE: the
# binary<->shim wire protocol can change across releases, so the exact version is
# fixed by Cargo.lock (currently 4.6.8). Bump deliberately; users then relaunch
# their shell (the install regenerates the shim on each startup).
clap_complete.workspace = true
ratatui.workspace = true
# ratatui 0.30's backend resolves to crossterm 0.29 by default; we import crossterm
# via the `ratatui::crossterm` re-export so event/Command types match the backend.
crossterm.workspace = true
toml.workspace = true

[package.metadata.binstall]
# Reuses the binaries published by .github/workflows/release.yml.
# bin-dir matches the release archive layout: the `work` binary is at the archive root.
pkg-url = "{ repo }/releases/download/v{ version }/work-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
