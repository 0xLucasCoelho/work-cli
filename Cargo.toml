[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Lucas Coelho"]
repository = "https://github.com/coelhucas-dev/work-cli"
description = "Isolated multi-context session manager for developers"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
dirs = "5"
tempfile = "3"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
include_dir = "0.7"
work-core = { path = "crates/core" }
