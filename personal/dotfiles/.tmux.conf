# --- existing essentials (image.nvim passthrough + extended keys) ---
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# --- true color so Monokai Pro renders correctly inside tmux ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# --- quality of life ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g history-limit 100000
set -g focus-events on

# --- sesh: fuzzy-jump between project/worktree sessions (prefix + f) ---
# Closest thing to JetBrains' "open project" — connect or create a session.
bind-key f display-popup -E -w 80% -h 70% "sesh connect \"$(
  sesh list --icons | fzf --ansi --no-sort --reverse --prompt='session ❯ ' \
    --header='jump to / create a session' --color=16
)\""
# prefix + L : last session (sesh)
bind-key L run-shell "sesh last"

# --- Monokai Pro themed status bar (matches Ghostty + nvim) ---
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#2D2A2E,fg=#FCFCFA"
set -g status-left-length 40
set -g status-left "#[bg=#AB9DF2,fg=#2D2A2E,bold] #S #[bg=#2D2A2E,fg=#AB9DF2]▕ "
set -g status-right-length 80
set -g status-right "#[fg=#78DCE8] %a %d %b #[fg=#FFD866] %H:%M #[fg=#A9DC76] #h "
setw -g window-status-current-format "#[fg=#FFD866,bold] #I:#W#{?window_zoomed_flag, ,} "
setw -g window-status-format "#[fg=#727072] #I:#W "
set -g pane-border-style "fg=#5B595C"
set -g pane-active-border-style "fg=#AB9DF2"
set -g message-style "bg=#FFD866,fg=#2D2A2E"
set -g mode-style "bg=#5B595C,fg=#FCFCFA"
